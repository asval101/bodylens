<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>身知 BodyLens · 推进镜头</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0908;--panel:#12100E;--panel2:#191512;
  --line:#262019;--line2:#3A3027;
  --ink:#F3EDE5;--muted:#9B8F84;--faint:#5F564E;
  --harm:#E8734A;--benefit:#8CB86E;--mixed:#D9A441;
  --ease:cubic-bezier(.2,.7,.3,1);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:56px minmax(0,1fr);height:100dvh;overflow:hidden}

header{display:flex;align-items:center;gap:28px;padding:0 24px;
  border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:20}
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.brand .zh{font-size:15px;letter-spacing:.16em;font-weight:500}
.brand .en{font-size:9px;letter-spacing:.3em;color:var(--faint)}
.seg{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:9px;
  border:1px solid var(--line)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:12px;padding:5px 14px;border-radius:7px;cursor:pointer;
  transition:color .25s var(--ease),background .25s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#2A231D;color:var(--ink)}
.count{margin-left:auto;font-size:11.5px;color:#8B7E72;letter-spacing:.06em}

main{display:grid;grid-template-columns:250px minmax(0,1fr) 372px;
  gap:1px;background:var(--line);overflow:hidden}
aside,section{background:var(--panel);min-height:0}

.picker{overflow-y:auto;padding:18px 0 40px;
  transition:opacity .55s var(--ease)}
.read{overflow-y:auto;padding:22px 24px 60px;
  transition:opacity .55s var(--ease)}
main.focused .picker,main.focused .read{opacity:.14;pointer-events:none}
.picker::-webkit-scrollbar,.read::-webkit-scrollbar{width:1px}
.picker::-webkit-scrollbar-thumb,.read::-webkit-scrollbar-thumb{background:var(--line2)}
.cat{padding:14px 20px 6px;font-size:10px;letter-spacing:.22em;color:var(--faint)}
.act{display:flex;align-items:center;gap:9px;width:100%;appearance:none;border:0;
  background:transparent;color:var(--muted);font:inherit;text-align:left;
  padding:7px 20px;cursor:pointer;position:relative;
  transition:color .2s var(--ease),background .2s var(--ease)}
.act::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;
  background:transparent;transition:background .25s var(--ease)}
.act:hover{color:var(--ink);background:#171310}
.act:hover::before{background:var(--line2)}
.act.on{color:var(--ink);background:#1C1714}
.act.on::before{background:var(--harm)}
.act .d{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none;
  transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.act.on .d{background:var(--harm);box-shadow:0 0 0 3px rgba(232,115,74,.16)}
.act[data-type="benefit"].on::before{background:var(--benefit)}
.act[data-type="benefit"].on .d{background:var(--benefit);box-shadow:0 0 0 3px rgba(140,184,110,.16)}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;overflow:hidden}
.stage-hd{position:absolute;top:26px;left:0;right:0;text-align:center;z-index:3;
  font-size:11.5px;letter-spacing:.1em;color:#7E7165;
  transition:opacity .4s var(--ease),color .4s var(--ease)}
.stage-hd b{color:#EFE7DE;font-weight:500}
.stage.focused .stage-hd,.stage.focused .legend,.stage.focused .hint{
  opacity:0;pointer-events:none}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 58% 46% at 50% 44%,rgba(232,115,74,.05),transparent 72%)}
/* 推进时压暗四周，制造镜筒感 */
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 62% 54% at 50% 50%,transparent 38%,rgba(6,5,4,.72) 100%);
  opacity:0;transition:opacity .8s var(--ease)}
.stage.focused::after{opacity:1}

svg#body{height:100%;width:auto;max-width:100%;position:relative;z-index:2;
  overflow:hidden;cursor:default}

.dust{fill:#6B5F54}
.ringfar{fill:none;stroke:#2A231C;stroke-width:.5}

.side{font-size:8px;letter-spacing:.34em;fill:#3E352D;
  font-family:system-ui,-apple-system,sans-serif}
.skel{fill:none;stroke:#4E4238;stroke-width:1.15;vector-effect:non-scaling-stroke}
.skel .lmb-o{stroke-width:12;stroke:#41372E;stroke-linecap:round}
.skel .lmb-i{stroke:none}
.skel .lg-o{stroke-width:18;stroke:#41372E;stroke-linecap:round}
.skel .lg-i{stroke:none}
.skel .soft{stroke:#41372E;stroke-width:1.1}
.skel .hand{fill:none;stroke:#41372E;stroke-width:1.1}

/* 不透明度由脚本逐帧写入，不能再挂 CSS 过渡：
   两者叠加会让过渡每帧重启，永远停在起始值。 */

.organ{--c:var(--harm);--v:0;--d:0;transition:opacity .4s var(--ease);cursor:pointer}
.organ .halo{fill:var(--c);opacity:0;filter:url(#soft);transition:opacity .7s var(--ease)}
.organ.on .halo{opacity:calc(var(--v) * .4);animation:breathe 6.4s ease-in-out infinite;
  animation-delay:var(--t);transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.organ .ring{fill:none;stroke:var(--c);stroke-width:0;opacity:0;vector-effect:non-scaling-stroke;
  transition:opacity .6s var(--ease),stroke-width .6s var(--ease)}
.organ.on .ring{opacity:calc(var(--d) * .55);stroke-dasharray:2.5 4;
  stroke-width:calc(.5 + var(--d) * 3.6)}
.organ .form{fill:none;stroke:#4E4238;stroke-width:.95;vector-effect:non-scaling-stroke;
  transition:fill .6s var(--ease),stroke .6s var(--ease),fill-opacity .6s var(--ease)}
.organ.on .form{fill:var(--c);fill-opacity:calc(.05 + var(--v) * .22);
  stroke:var(--c);stroke-opacity:calc(.2 + var(--v) * .8);
  stroke-width:calc(1 + var(--v) * .9)}
.organ.on .warm{filter:drop-shadow(0 0 6px var(--c))}
.organ:hover .form{stroke:#8C7C6C}
.organ .lead{stroke:#4A3E34;stroke-width:.6;opacity:0;vector-effect:non-scaling-stroke;
  transition:opacity .45s var(--ease)}
.organ .lbl{font-size:10.5px;letter-spacing:.06em;fill:#7C6F63;opacity:0;
  transition:opacity .45s var(--ease),fill .45s var(--ease);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.organ.on .lead{opacity:.9}
.organ.on .lbl{opacity:1;fill:#B5A697}
/* 推进后标签与外环让位，避免被放大成噪声 */
#body.deep .organ .lbl,#body.deep .organ .lead{opacity:0}
#body.deep .organ.on .halo{opacity:calc(var(--v) * .13);animation:none}
#body.deep .organ .ring{opacity:0}
#body.deep .organ .det{opacity:0}
/* 推进后只留一个器官，其余退成背景 */
#body.deep .organ:not(.focus){opacity:.13}

.link{fill:none;stroke:var(--c);stroke-width:.9;opacity:0;vector-effect:non-scaling-stroke;
  transition:opacity .55s var(--ease)}
.link.on{opacity:calc(var(--v) * .52)}

/* 微观层：只在推进到足够近时才存在 */
.micro{opacity:0;color:var(--c);stroke-linecap:round;stroke-linejoin:round}
.micro .solid{fill:currentColor;fill-opacity:.18}
.micro path,.micro circle,.micro rect,.micro ellipse,.micro line{
  fill:none;stroke:currentColor;stroke-width:.85;opacity:.92;
  vector-effect:non-scaling-stroke}

/* 到达后，被聚焦的器官必须有足够存在感，不依赖是否选中行为 */
.organ.focus .form{fill:var(--c);fill-opacity:.14;stroke:var(--c);
  stroke-opacity:.95;stroke-width:1.6}
.organ.focus .halo{opacity:.14;animation:none}

.legend{position:absolute;left:0;right:0;bottom:16px;z-index:3;display:flex;
  align-items:center;justify-content:center;gap:16px;
  font-size:10.5px;color:var(--faint);letter-spacing:.05em;
  transition:opacity .4s var(--ease);pointer-events:none}
.legend .sw{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;
  vertical-align:1px}
.legend .sw.harm{background:var(--harm)}
.legend .sw.benefit{background:var(--benefit)}
.legend .sw.mixed{background:var(--mixed)}
.legend .ln{width:1px;height:10px;background:var(--line2)}

.hint{position:absolute;left:0;right:0;bottom:46px;z-index:3;text-align:center;
  font-size:10.5px;letter-spacing:.14em;color:#574E46;
  transition:opacity .4s var(--ease);pointer-events:none}

/* 返回 */
.back{position:absolute;left:22px;top:20px;z-index:8;display:flex;align-items:center;gap:8px;
  appearance:none;background:rgba(25,21,18,.72);border:1px solid var(--line2);
  color:var(--muted);font:inherit;font-size:11.5px;letter-spacing:.04em;
  padding:6px 13px 6px 11px;border-radius:8px;cursor:pointer;
  opacity:0;transform:translateX(-6px);pointer-events:none;
  transition:opacity .45s var(--ease),transform .45s var(--ease),
             color .2s,border-color .2s,background .2s}
.back.on{opacity:1;transform:none;pointer-events:auto}
.back:hover{color:var(--ink);border-color:#5A4A3C;background:rgba(35,29,24,.9)}
.back svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6}

/* 到达后的信息卡 */
.fcard{position:absolute;left:24px;bottom:24px;width:min(310px,46%);z-index:7;
  background:rgba(17,15,13,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line2);border-radius:13px;padding:15px 17px 13px;
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .6s var(--ease) .3s,transform .6s var(--ease) .3s}
.fcard.on{opacity:1;transform:none;pointer-events:auto}
.fc-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.fc-en{font-size:9px;letter-spacing:.28em;color:var(--faint)}
.fc-x{margin-left:auto;font-size:10px;letter-spacing:.1em;color:#6A5F55;
  font-variant-numeric:tabular-nums}
.fcard h3{margin:0;font-size:19px;font-weight:500;letter-spacing:.1em}
.fc-role{margin:3px 0 12px;font-size:11.5px;color:#8C7F73;letter-spacing:.04em}
.fc-row{display:flex;align-items:center;gap:8px;padding:5px 0;
  border-top:1px solid rgba(58,48,39,.55);font-size:12px;color:#C4B6A8}
.fc-row i{width:4px;height:4px;border-radius:50%;background:var(--c,var(--harm));flex:none}
.fc-row em{margin-left:auto;font-style:normal;font-size:10.5px;color:#8C7F73;letter-spacing:.06em}
.fc-none{margin:6px 0 0;font-size:11.5px;line-height:1.9;color:#7E7165}
.fc-exit{margin:12px 0 0;font-size:10px;letter-spacing:.1em;color:#574E46}

.read{overflow-y:auto;padding:22px 24px 60px}
.empty{color:var(--faint);font-size:12.5px;line-height:2.1;margin:36px 0 0}
.empty b{color:var(--muted);font-weight:400}

.lead{font-size:13px;line-height:2;color:#B3A699;margin:0 0 22px;
  padding-bottom:20px;border-bottom:1px solid var(--line)}
.lead b{color:var(--ink);font-weight:500}
.lead .h{color:var(--harm)}
.lead .b{color:var(--benefit)}

.ob{margin-bottom:20px;animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ob-h{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.ob-h .nm{font-size:13px;font-weight:500;letter-spacing:.05em;color:#E4DAD0}
.ob-h .dv{font-size:10px;letter-spacing:.16em;color:var(--faint);margin-left:auto}
.ob-h .bar{flex:1;height:1px;background:var(--line);margin-bottom:4px}

.it{padding:0 0 12px 11px;border-left:1px solid var(--line);position:relative}
.it:last-child{padding-bottom:2px}
.it::before{content:"";position:absolute;left:-2.5px;top:7px;width:4px;height:4px;
  border-radius:50%;background:var(--c,var(--harm))}
.ih{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.ih .bn{font-size:12px;color:var(--ink)}
.ih em{font-style:normal;font-size:10.5px;letter-spacing:.08em;color:#8C7F73;
  margin-left:auto;white-space:nowrap}
.it p{margin:0;font-size:12.5px;line-height:1.85;color:#BCAFA2}
.scl{display:flex;gap:2px;margin-top:6px}
.scl i{width:11px;height:2px;background:var(--line2);border-radius:1px}
.scl i.on{background:var(--c,var(--harm));opacity:.8}

.tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transform:translate(-50%,-140%);
  background:#221C18;border:1px solid var(--line2);color:var(--ink);
  font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;
  transition:opacity .15s}
.tip.on{opacity:1}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media(max-width:1120px){
  main{grid-template-columns:210px minmax(0,1fr) 320px}
}
@media(max-width:900px){
  body{grid-template-rows:auto auto;height:auto;overflow:auto}
  main{grid-template-columns:1fr;overflow:visible}
  .picker{max-height:200px;display:flex;flex-wrap:wrap;gap:2px;padding:10px}
  .cat{width:100%}
  .act{width:auto;padding:5px 10px;border-radius:6px}
  .act::before{display:none}
  svg#body{height:70vh}
  .fcard{width:calc(100% - 40px);left:20px}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="zh">身知</span><span class="en">BODYLENS</span></div>
  <div class="seg" id="seg">
    <button data-scale="near" class="on">此刻</button>
    <button data-scale="far">如果一直这样</button>
  </div>
  <div class="count" id="count">未选择行为</div>
</header>

<main id="main">
  <aside class="picker" id="picker"></aside>

  <section class="stage" id="stage">
    <div class="stage-hd" id="stageHd">尚未选择行为</div>

    <svg id="body" viewBox="0 0 400 760" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>

      <!-- 远景：尘埃与同心环，随镜头移动最慢 -->
      <g id="farLayer"></g>

      <g id="bodyLayer">
        <text class="side" x="46" y="392" transform="rotate(-90 46 392)">HUMAN ANATOMY</text>
        <text class="side" x="358" y="392" transform="rotate(-90 358 392)">BEHAVIORAL TRACE</text>
        <g class="skel">
          <ellipse cx="200" cy="74" rx="38" ry="48"/>
          <path d="M186 116 L186 148 M214 116 L214 148"/>
          <path d="M200 146 C172 150 153 158 146 176 C139 196 143 226 149 256
                   C154 282 159 302 161 324 C163 346 161 362 157 377
                   L243 377 C239 362 237 346 239 324 C241 302 246 282 251 256
                   C257 226 261 196 254 176 C247 158 228 150 200 146 Z"/>
          <path class="lmb-o" d="M147 177 C136 199 131 231 133 263 C135 293 139 319 143 341"/>
          <path class="lmb-i" d="M147 177 C136 199 131 231 133 263 C135 293 139 319 143 341"/>
          <path class="lmb-o" d="M253 177 C264 199 269 231 267 263 C265 293 261 319 257 341"/>
          <path class="lmb-i" d="M253 177 C264 199 269 231 267 263 C265 293 261 319 257 341"/>
          <path class="lg-o" d="M177 377 C173 443 171 523 170 603 L169 693"/>
          <path class="lg-i" d="M177 377 C173 443 171 523 170 603 L169 693"/>
          <path class="lg-o" d="M223 377 C227 443 229 523 230 603 L231 693"/>
          <path class="lg-i" d="M223 377 C227 443 229 523 230 603 L231 693"/>
          <ellipse class="hand" cx="143" cy="352" rx="6.5" ry="9"/>
          <ellipse class="hand" cx="257" cy="352" rx="6.5" ry="9"/>
          <ellipse class="soft" cx="163" cy="702" rx="15" ry="8"/>
          <ellipse class="soft" cx="237" cy="702" rx="15" ry="8"/>
        </g>
      </g>

      <g id="linkLayer"></g>
      <g id="organLayer"></g>
      <g id="microLayer"></g>
    </svg>

    <button class="back" id="back">
      <svg viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg>
      返回全身
    </button>

    <div class="fcard" id="fcard"></div>

    <div class="legend">
      <span><i class="sw harm"></i>不利</span>
      <span><i class="sw benefit"></i>有益</span>
      <span><i class="sw mixed"></i>同时被拉向两边</span>
      <span class="ln"></span>
      <span>外环越粗，留得越久</span>
    </div>
    <div class="hint">点击任一器官 · 镜头推进</div>
  </section>

  <aside class="read" id="read"></aside>
</main>

<div class="tip" id="tip"></div>

<script>
'use strict';

/* ───────────── 数据 ───────────── */

const ORG = {
  spine:  {n:'脊柱与肌肉', en:'SPINE',   z:2.9, role:'支撑与姿态', x:200, y:330, r:20, rx:14, ry:96, lx:132, ly:340, a:'end'},
  brain:  {n:'大脑',       en:'BRAIN',   z:5.2, role:'感知与调控', x:200, y:72,  r:24, rx:26, ry:22, lx:266, ly:64,  a:'start'},
  eyes:   {n:'眼睛',       en:'EYES',    z:7.2, role:'视觉',       x:200, y:90,  r:16, rx:26, ry:12, lx:266, ly:92,  a:'start'},
  mouth:  {n:'口腔',       en:'MOUTH',   z:10.5, role:'入口',       x:200, y:108, r:12, rx:14, ry:7,  lx:266, ly:116, a:'start'},
  lungs:  {n:'肺部',       en:'LUNGS',   z:4.7, role:'气体交换',   x:200, y:197, r:34, rx:38, ry:30, lx:266, ly:194, a:'start'},
  kidneys:{n:'肾脏',       en:'KIDNEYS', z:4.9, role:'过滤与平衡', x:200, y:279, r:30, rx:38, ry:15, lx:132, ly:286, a:'end'},
  heart:  {n:'心脏',       en:'HEART',   z:6.8, role:'泵血',       x:204, y:220, r:20, rx:15, ry:17, lx:266, ly:230, a:'start'},
  liver:  {n:'肝脏',       en:'LIVER',   z:5, role:'代谢与解毒', x:174, y:253, r:24, rx:25, ry:16, lx:132, ly:252, a:'end'},
  stomach:{n:'胃',         en:'STOMACH', z:8, role:'消化',       x:225, y:264, r:18, rx:14, ry:17, lx:266, ly:268, a:'start'},
  gut:    {n:'肠道',       en:'GUT',     z:4.8, role:'吸收与菌群', x:200, y:307, r:28, rx:29, ry:22, lx:132, ly:314, a:'end'}
};

const SHAPE = {
  spine:'<path class="form" d="M200 154 L200 352" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="1.5 7"/>',
  brain:'<ellipse class="form" cx="200" cy="72" rx="25" ry="20"/>' +
        '<path class="form det" d="M182 63 Q191 72 184 83 M218 63 Q209 72 216 83" fill="none" stroke-width=".8"/>',
  eyes:'<ellipse class="form" cx="187" cy="90" rx="5" ry="4"/>' +
       '<ellipse class="form" cx="213" cy="90" rx="5" ry="4"/>',
  mouth:'<path class="form" d="M188 106 Q200 114 212 106" fill="none" stroke-width="3" stroke-linecap="round"/>',
  lungs:'<path class="form" d="M194 175 C180 175 168 187 166 205 C164 221 172 230 184 228 C192 226 194 214 194 198 Z"/>' +
        '<path class="form" d="M206 175 C220 175 232 187 234 205 C236 221 228 230 216 228 C208 226 206 214 206 198 Z"/>' +
        '<path class="form det" d="M200 172 L200 190" fill="none" stroke-width="1.2"/>',
  kidneys:'<path class="form" d="M174 269 C167 269 163 278 165 287 C167 295 175 295 177 287 C179 279 178 271 174 269 Z"/>' +
          '<path class="form" d="M226 269 C233 269 237 278 235 287 C233 295 225 295 223 287 C221 279 222 271 226 269 Z"/>',
  heart:'<path class="form" d="M206 205 C215 203 221 210 220 220 C219 229 211 235 206 240 C201 235 194 228 195 218 C196 209 200 206 206 205 Z"/>',
  liver:'<path class="form" d="M153 246 C166 240 187 242 194 251 C200 259 188 270 172 268 C160 266 150 256 153 246 Z"/>',
  stomach:'<path class="form" d="M222 250 C233 250 238 262 234 273 C230 283 219 281 217 272 C215 262 216 252 222 250 Z"/>',
  gut:'<ellipse class="form" cx="200" cy="307" rx="27" ry="20"/>' +
      '<path class="form det" d="M187 296 Q200 306 187 317 M200 294 Q213 306 200 320" fill="none" stroke-width=".8"/>'
};

/* 微观层的裁剪范围，比轮廓略大一圈，保证线条收在器官内 */
const CLIPMARK = {
  spine:'<rect x="189" y="150" width="22" height="204" rx="6"/>',
  brain:'<ellipse cx="200" cy="72" rx="25" ry="20"/>',

/* 微观细节。每处器官给一套不同的「地貌」，只有在镜头推近时才存在。 */
function tree(x, y, ang, len, dep, out) {
  const x2 = x + Math.cos(ang) * len;
  const y2 = y + Math.sin(ang) * len;
  out.push('M' + x.toFixed(2) + ' ' + y.toFixed(2) + 'L' + x2.toFixed(2) + ' ' + y2.toFixed(2));
  if (dep <= 0) return;
  tree(x2, y2, ang - .46, len * .68, dep - 1, out);
  tree(x2, y2, ang + .46, len * .68, dep - 1, out);
}

    const r = .25 + rnd() * 1.05;
    s += '<circle class="dust" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
         '" r="' + r.toFixed(2) + '" opacity="' + (.12 + rnd() * .3).toFixed(2) + '"/>';
  }
  [150, 214, 286, 372].forEach(r => {
    s += '<circle class="ringfar" cx="200" cy="380" r="' + r + '"/>';
  });
  document.getElementById('farLayer').innerHTML = s;
})();

organLayer.innerHTML = Object.keys(ORG).map((k, i) => {
  const o = ORG[k];
  const dx = o.lx - o.x, dy = o.ly - o.y;
  const len = Math.hypot(dx, dy) || 1;
  const sx = (o.x + dx / len * o.r).toFixed(1);
  const sy = (o.y + dy / len * o.r).toFixed(1);
  return '<g class="organ" data-k="' + k + '" style="--c:var(--harm);--t:' + (i * 0.63).toFixed(2) + 's">' +
    '<circle class="halo" cx="' + o.x + '" cy="' + o.y + '" r="' + o.r + '"/>' +
    SHAPE[k] +
    '<ellipse class="ring" cx="' + o.x + '" cy="' + o.y + '" rx="' + o.rx + '" ry="' + o.ry + '"/>' +
    '<line class="lead" x1="' + sx + '" y1="' + sy + '" x2="' + o.lx + '" y2="' + o.ly + '"/>' +
    '<text class="lbl" x="' + o.lx + '" y="' + o.ly + '" text-anchor="' + o.a +
      '" dominant-baseline="middle">' + o.n + '</text>' +
    '</g>';
}).join('');

const organEl = {};
document.querySelectorAll('.organ').forEach(g => { organEl[g.dataset.k] = g; });

/* 微观层：裁剪路径 + 细节，默认完全透明 */
microLayer.innerHTML = Object.keys(ORG).map(k =>
  '<clipPath id="clip-' + k + '">' + CLIPMARK[k] + '</clipPath>' +
  '<g class="micro" id="micro-' + k + '" clip-path="url(#clip-' + k + ')" ' +
  'style="--c:var(--harm)">' + MICRO[k]() + '</g>'
).join('');

const microEl = {};
Object.keys(ORG).forEach(k => { microEl[k] = document.getElementById('micro-' + k); });

linkLayer.innerHTML = BEHAVIORS.flatMap(b => b.eff.map(e => {
  const o = ORG[e.o], a = ORIGIN[b.id] || [200,190];
  const mx = (a[0] + o.x) / 2;
  const my = (a[1] + o.y) / 2;
  const d = 'M' + a[0] + ' ' + a[1] + 'Q' + mx + ' ' + my + ' ' + o.x + ' ' + o.y;
  return '<path class="link" data-e="' + b.id + '|' + e.o + '" style="--c:var(--' + e.t + ');--v:0" d="' + d + '"/>';
})).join('');

const linkEl = {};
document.querySelectorAll('.link').forEach(p => { linkEl[p.dataset.e] = p; });

pickerEl.innerHTML = ['烟酒','睡眠作息','运动','久坐','用眼','饮食饮水','日常清洁']
  .map(cat => {
    const items = BEHAVIORS.filter(b => b.cat === cat);
    if (!items.length) return '';
    return '<div class="cat">' + cat + '</div>' + items.map(b =>
      '<button class="act" data-id="' + b.id + '" data-type="' + b.type + '">' +
        '<i class="d"></i><span>' + b.name + '</span>' +
      '</button>').join('');
  }).join('');

/* ───────────── 计算 ───────────── */

function compute() {
  const acc = {};
  const effs = [];
  for (const id of state.active) {
    const b = byId.get(id);
    for (const e of b.eff) {
      const decay = state.scale === 'near' ? 1 :
        (BACK[e.back].d < .35 ? .04 : BACK[e.back].d < .6 ? .3 : 1);
      const v = (state.scale === 'near' ? e.near : e.far) * decay;
      if (!acc[e.o]) acc[e.o] = { harm:0, benefit:0, items:[] };
      if (e.t === 'benefit') acc[e.o].benefit = Math.max(acc[e.o].benefit, v);
      else acc[e.o].harm = Math.max(acc[e.o].harm, v);
      acc[e.o].items.push({ b, e, v });
      effs.push({ b, e, v, o:e.o });
    }
  }
  return { acc, effs };
}

function render() {
  const { acc, effs } = compute();
  const onKeys = Object.keys(acc);

  for (const k of Object.keys(ORG)) {
    const g = organEl[k];
    const a = acc[k];
    if (!a || Math.max(a.harm, a.benefit) < .05) {
      g.classList.remove('on');
      g.style.setProperty('--v', '0');
      continue;
    }
    const both = a.harm > 0 && a.benefit > 0;
    const type = both ? 'mixed' : (a.benefit > 0 ? 'benefit' : 'harm');
    const v = both ? Math.max(a.harm, a.benefit) : (a.benefit || a.harm);
    const d = Math.max.apply(null, a.items.map(it => BACK[it.e.back].d));
    g.classList.add('on');
    g.style.setProperty('--c', 'var(--' + type + ')');
    g.style.setProperty('--v', v.toFixed(2));
    g.style.setProperty('--d', d.toFixed(2));
    if (microEl[k]) microEl[k].style.setProperty('--c', 'var(--' + type + ')');
  }

  const linkState = {};
  for (const f of effs) linkState[f.b.id + '|' + f.o] = f.v;

  for (const key of Object.keys(linkEl)) {
    const p = linkEl[key];
    const v = linkState[key];
    if (v === undefined) { p.classList.remove('on'); continue; }
    p.style.setProperty('--v', v.toFixed(2));
    p.classList.add('on');
  }

  const hd = document.getElementById('stageHd');
  if (hd) {
    hd.innerHTML = !effs.length
      ? '尚未选择行为'
      : (state.scale === 'near'
        ? '此刻，<b>' + state.active.size + '</b> 个行为正在身体里发生'
        : '如果一直这样，<b>' + Object.keys(acc).filter(k =>
            acc[k].items.some(it => BACK[it.e.back].d >= .5)).length + '</b> 处会留下痕迹');
  }

  const shownKeys = state.scale === 'near'
    ? onKeys
    : onKeys.filter(k => acc[k].items.some(it => BACK[it.e.back].d >= .5));
  countEl.textContent = !effs.length
    ? '未选择行为'
    : state.active.size + ' 个行为 · 波及 ' + shownKeys.length + ' 处';

  document.querySelectorAll('.act').forEach(btn => {
    btn.classList.toggle('on', state.active.has(btn.dataset.id));
  });

  renderRead(acc, effs);
  if (state.focus) renderFocus();
}

function renderRead(acc, effs) {
  if (!effs.length) {
    readEl.innerHTML = '<p class="empty">' +
      '点左边的任意一个行为。<br>' +
      '身体不会给这件事打分。<br>' +
      '它只回答两个问题——<br>' +
      '<b>牵动了哪几处，以及留得多久。</b></p>';
    return;
  }

  const allKeys = Object.keys(acc);
  const keep = k => state.scale === 'near'
    || acc[k].items.some(it => BACK[it.e.back].d >= .5);
  const keys = allKeys.filter(keep);
  const shown = effs.filter(f => state.scale === 'near' || BACK[f.e.back].d >= .5);
  const quick = shown.filter(f => BACK[f.e.back].d < .5).length;
  const slow = shown.filter(f => BACK[f.e.back].d >= .5).length;

  const lead = '牵连 <b>' + keys.length + '</b> 处：' + keys.map(k => ORG[k].n).join('、') +
    (state.scale === 'near'
      ? '。其中 <b>' + quick + '</b> 项影响会自行散去，<b class="' +
        (slow > quick ? 'h' : 'b') + '">' + slow + '</b> 项会留下更久的痕迹。'
      : '。这些是即使现在停下，也不会随之消失的部分。');

  if (!keys.length) {
    readEl.innerHTML = '<p class="lead">在"此刻"之外，这些行为没有留下会累积的痕迹。切回"此刻"可以看当下的反应。</p>';
    return;
  }

  const blocks = keys
    .map(k => ({ k, d: Math.max.apply(null, acc[k].items.map(it => BACK[it.e.back].d)) }))
    .sort((a, b) => b.d - a.d)
    .map(({ k }) => {
      const a = acc[k];
      const both = a.harm > 0 && a.benefit > 0;
      const type = both ? 'mixed' : (a.benefit > 0 ? 'benefit' : 'harm');
      const items = a.items
        .filter(it => state.scale === 'near' || BACK[it.e.back].d >= .5)
        .slice()
        .sort((x, y) => BACK[y.e.back].d - BACK[x.e.back].d)
        .map(it => {
          const seg = ORDER.indexOf(it.e.back) + 1;
          const marks = ORDER.map((_, i) => '<i class="' + (i < seg ? 'on' : '') + '"></i>').join('');
          const text = state.scale === 'near' ? it.e.now : it.e.later;
          return '<div class="it" style="--c:var(--' + it.e.t + ')">' +
            '<div class="ih"><span class="bn">' + it.b.name + '</span>' +
              '<em>' + BACK[it.e.back].t + '</em></div>' +
            '<p>' + text + '</p>' +
            '<div class="scl">' + marks + '</div>' +
          '</div>';
        }).join('');
      return '<div class="ob">' +
        '<div class="ob-h"><span class="nm">' + ORG[k].n + '</span>' +
          '<span class="bar"></span>' +
          '<span class="dv" style="color:var(--' + type + ')">' +
            (both ? '两个方向' : (type === 'benefit' ? '有益' : '不利')) + '</span></div>' +
        items +
      '</div>';
    }).join('');

  readEl.innerHTML = '<p class="lead">' + lead + '</p>' + blocks;
}

/* ───────────── 镜头 ───────────── */

const LAYERS = [
  [document.getElementById('farLayer'),  0.4],
  [document.getElementById('bodyLayer'), 0.88],
  [document.getElementById('linkLayer'), 0.95],
  [organLayer,                           1.0],
  [microLayer,                           1.0]
];

const CAM  = { x:200, y:380, z:1 };
const TGT  = { x:200, y:380, z:1 };
const VEL  = { x:0, y:0, z:0 };
const mouse = { x:0, y:0, on:false };
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 欠阻尼弹簧：推过去、略微冲过、再稳住。
   这是「超级壁纸」那股物理感的来源，缓动曲线做不出来。 */
const SPRING_K = 108;
const SPRING_C = 16.5;

let lastT = performance.now();
let prevZ = 1;

function applyCamera(now) {
  const z = CAM.z;
  /* 极慢的呼吸位移，让静止时画面也不是死的 */
  const breathe = state.focus ? Math.sin(now * 0.00062) * 0.11 : 0;
  const px = mouse.on ? mouse.x * 7 / Math.max(1, z) : 0;
  const py = mouse.on ? mouse.y * 7 / Math.max(1, z) : 0;
  const fx = CAM.x + px;
  const fy = CAM.y + py;
  const zz = z + breathe;

  for (let i = 0; i < LAYERS.length; i++) {
    const el = LAYERS[i][0];
    const s = 1 + (zz - 1) * LAYERS[i][1];
    const tx = 200 - fx * s;
    const ty = 380 - fy * s;
    el.setAttribute('transform',
      'translate(' + tx.toFixed(2) + ' ' + ty.toFixed(2) + ') scale(' + s.toFixed(4) + ')');
  }

  /* 身体作为背景退场，器官成为主体 */
  document.getElementById('bodyLayer').style.opacity =
    String(Math.max(.05, 1 - (z - 1) * .33));
  linkLayer.style.opacity = String(Math.max(0, 1 - Math.max(0, z - 1.35) / 1.5));

  /* 微观细节随距离浮现：这是「靠近才看见」的核心 */
  const mv = Math.max(0, Math.min(1, (z - 1.9) / 2.2));
  for (const k of Object.keys(microEl)) {
    microEl[k].style.opacity = state.focus === k ? mv.toFixed(3) : '0';
  }

  bodyEl.classList.toggle('deep', z > 2.05);

  /* 运动模糊只在移动时存在，停下即消失 */
  const v = Math.abs(z - prevZ) * 60;
  prevZ = z;
  const bl = v > .35 ? Math.min(2.6, v * .22) : 0;
  document.getElementById('bodyLayer').style.filter = bl > .02 ? 'blur(' + bl.toFixed(2) + 'px)' : '';
}

function tick(now) {
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;

  if (REDUCE) {
    CAM.x = TGT.x; CAM.y = TGT.y; CAM.z = TGT.z;
  } else {
    ['x','y','z'].forEach(a => {
      VEL[a] += (TGT[a] - CAM[a]) * SPRING_K * dt;
      VEL[a] -= VEL[a] * SPRING_C * dt;
      CAM[a] += VEL[a] * dt;
    });
  }

  applyCamera(now);
  requestAnimationFrame(tick);
}

function enter(k) {
  if (!ORG[k]) return;
  const { acc } = compute();
  const a = acc[k];

  if (state.focus && organEl[state.focus]) {
    organEl[state.focus].classList.remove('focus');
  }

  state.focus = k;
  TGT.x = ORG[k].x;
  TGT.y = ORG[k].y;
  TGT.z = ORG[k].z;

  document.querySelectorAll('.organ').forEach(g => g.classList.remove('focus'));
  organEl[k].classList.add('focus');
  /* 没有行为牵涉时用中性骨色，避免橙色被误读成「有害」 */
  let paint;
  if (!a) paint = '#C6B2A0';
  else {
    const both = a.harm > 0 && a.benefit > 0;
    paint = 'var(--' + (both ? 'mixed' : (a.benefit > 0 ? 'benefit' : 'harm')) + ')';
  }
  organEl[k].style.setProperty('--c', paint);
  microEl[k].style.setProperty('--c', paint);

  mainEl.classList.add('focused');
  stageEl.classList.add('focused');
  backEl.classList.add('on');
  renderFocus();
  fcardEl.classList.add('on');
}

function exit() {
  if (!state.focus) return;
  const k = state.focus;
  organEl[k].classList.remove('focus');
  organEl[k].style.setProperty('--c', 'var(--harm)');
  microEl[k].style.setProperty('--c', 'var(--harm)');

  state.focus = null;
  TGT.x = 200; TGT.y = 380; TGT.z = 1;
  mainEl.classList.remove('focused');
  stageEl.classList.remove('focused');
  backEl.classList.remove('on');
  fcardEl.classList.remove('on');
  render();
}

function renderFocus() {
  const k = state.focus;
  if (!k) return;
  const o = ORG[k];
  const { acc } = compute();
  const a = acc[k];

  let body;
  if (a && a.items.length) {
    const rows = a.items.slice()
      .sort((x, y) => BACK[y.e.back].d - BACK[x.e.back].d)
      .map(it => '<div class="fc-row" style="--c:var(--' + it.e.t + ')">' +
        '<i></i><span>' + it.b.name + '</span><em>' + BACK[it.e.back].t + '</em></div>')
      .join('');
    body = rows;
  } else {
    body = '<p class="fc-none">此刻所选的行为还没有牵涉到这一处。<br>它仍然可以放大查看。</p>';
  }

  fcardEl.innerHTML =
    '<div class="fc-top"><span class="fc-en">' + o.en + '</span>' +
      '<span class="fc-x" id="fcx">×' + o.z.toFixed(1) + '</span></div>' +
    '<h3>' + o.n + '</h3>' +
    '<p class="fc-role">' + o.role + '</p>' +
    body +
    '<p class="fc-exit">点空白处或按 Esc 退出</p>';
}

/* ───────────── 交互 ───────────── */

pickerEl.addEventListener('click', ev => {
  const btn = ev.target.closest('.act');
  if (!btn) return;
  const id = btn.dataset.id;
  if (state.active.has(id)) state.active.delete(id);
  else state.active.add(id);
  render();
});

document.getElementById('seg').addEventListener('click', ev => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  state.scale = btn.dataset.scale;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === btn));
  render();
});

organLayer.addEventListener('click', ev => {
  const g = ev.target.closest('.organ');
  if (!g) return;
  ev.stopPropagation();
  enter(g.dataset.k);
});

backEl.addEventListener('click', ev => { ev.stopPropagation(); exit(); });
fcardEl.addEventListener('click', ev => ev.stopPropagation());
stageEl.addEventListener('click', () => { if (state.focus) exit(); });

addEventListener('keydown', ev => { if (ev.key === 'Escape') exit(); });

stageEl.addEventListener('mousemove', ev => {
  const r = stageEl.getBoundingClientRect();
  mouse.x = (ev.clientX - r.left) / r.width * 2 - 1;
  mouse.y = (ev.clientY - r.top) / r.height * 2 - 1;
  mouse.on = true;
  if (!state.focus) {
    const g = ev.target.closest('.organ');
    if (g) {
      tipEl.textContent = ORG[g.dataset.k].n;
      tipEl.style.left = ev.clientX + 'px';
      tipEl.style.top = ev.clientY + 'px';
      tipEl.classList.add('on');
    } else tipEl.classList.remove('on');
  } else tipEl.classList.remove('on');
});
stageEl.addEventListener('mouseleave', () => {
  mouse.on = false; mouse.x = 0; mouse.y = 0;
  tipEl.classList.remove('on');
});

/* 便于截图与分享：?focus=lungs 直接落到该器官 */
const qs = new URLSearchParams(location.search);
const q = qs.get('focus');
render();
requestAnimationFrame(tick);
if (q && ORG[q]) {
  enter(q);
  if (REDUCE || qs.get('snap')) { CAM.x = TGT.x; CAM.y = TGT.y; CAM.z = TGT.z; }
}
</script>
</body>
</html>
